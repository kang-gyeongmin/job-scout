# 다인용 설정 — 사람마다 프로필·검색조건·Notion DB를 따로 둔다.
# 매일 실행 시 각 사람별로 수집 → 채점 → 그 사람 Notion DB에 저장한다.

# 사람별로 생략하면 쓰이는 공통 기본값
defaults:
  locations: ["서울", "경기", "인천"]
  max_experience_from: 1   # 최소 요구 경력 상한(년). 0=신입만, 1=1년 이하 허용
  min_score: 6             # 이메일 포함 기준
  notion_min_score: 5      # Notion 저장 기준(대시보드는 전부 기록)
  top_n: 10                # 이메일 최대 공고 수

email:
  enabled: false   # true로 바꾸면 메일 발송 (SMTP_PASSWORD 필요)
  to: rkdrudals991@naver.com
  from: rkdrudals991@naver.com
  smtp_host: smtp.naver.com
  smtp_port: 465

people:
  # 본인 — 데이터 엔지니어 (IT 소스 전부)
  - id: gyeongmin
    profile: people/gyeongmin/profile.md
    notion_db_env: NOTION_DB_ID
    notion_min_score: 7   # 7점 이상만 노션에 표시
    experience: "신입~주니어(3년 이하)"
    job_keywords: ["데이터 엔지니어", "Data Engineer", "데이터 인턴", "개발 인턴"]
    jumpit_categories: "19"   # 빅데이터
    sites:
      wanted: true
      saramin: false
      work24: true
      jumpit: true
      catch: true
      jobkorea: true
      zighang: true

  # 피부관리사(에스테틱) 신입 — 비IT, 키워드 기반 소스 위주
  - id: cosmetic
    profile: people/cosmetic/profile.md
    notion_db_env: NOTION_DB_COSMETIC
    experience: "신입"
    job_keywords: ["피부관리사", "에스테틱", "피부미용", "스킨케어",
                   "피부관리", "에스테티션"]
    sites:
      wanted: true
      jobkorea: true

  # 기계공학 R&D 신입 (대학원 재학) — 비IT, 키워드 기반 소스 위주
  - id: mech
    profile: people/mech/profile.md
    notion_db_env: NOTION_DB_MECH
    experience: "신입"
    job_keywords: ["기계 연구개발", "기계설계", "의료기기 연구개발", "의료기기",
                   "로봇 엔지니어", "기구설계", "연구개발 엔지니어"]
    catch_jobcode: "0501,0504,0505"          # 자동차·조선·기계 / 전기·전자·제어 / 기계설계
    zighang_categories: "엔지니어링_연구_RND,생산_기능"
    work24_dty: "15"                          # 연구(일경험)
    sites:
      wanted: true
      jobkorea: true
      catch: true       # 연구개발/설계 직무
      zighang: true      # 엔지니어링·R&D
      work24: true       # 연구 일경험
